[package]
name = "polyrover"
version = "0.2.0"
edition = "2021"
description = "Async Rust SDK and CLI for Polymarket with a safe public-data default"
repository = "https://github.com/TrebuchetDynamics/polyrover"
license = "MIT"

[features]
default = ["public"]
public = ["dep:futures-util", "dep:reqwest", "dep:tokio", "dep:tokio-tungstenite"]
authenticated = ["public", "dep:base64", "dep:hmac", "dep:sha2"]
wallet = ["dep:hex", "dep:sha3"]
execution = ["authenticated", "wallet"]
bridge = []
full = ["execution", "bridge"]
typesafe = ["public", "dep:roxmltree", "dep:scraper", "dep:sha2"]
server = ["typesafe", "dep:axum", "dep:tower-http", "dep:tokio-postgres", "dep:postgres-native-tls", "dep:native-tls"]

[dependencies]
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
tower-http = { version = "0.6", features = ["cors", "set-header"], optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"] }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
roxmltree = { version = "0.21", optional = true }
scraper = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "polyrover"
path = "src/lib.rs"

[[bin]]
name = "polyrover"
path = "src/main.rs"
required-features = ["public"]
